<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>demo ajax TODO</title>

    <!-- google font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Exo:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="css/bootstrap.min.css">
    <link rel="stylesheet" href="css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <section class="w-50 mx-auto mt-5">
        <form action="" class="bg-white rounded p-4  d-flex shadow">
            <input type="text" placeholder="task to be done" class="todo-input form-control">
            <button type="submit" class="ms-5 rounded submit-form-btn">Add</button>
        </form>


        <ul class="TODO  bg-white rounded  p-4 mt-5 shadow">
            <li class="d-flex justify-content-between align-items-center border-bottom pb-2 my-2">
                <span class="task-name" style="text-decoration: none;">test1</span>
                <!-- <span class="remark-task">click to make the task be completed :)</span> -->
                <div class="d-flex align-items-center gap-4 ">
                    <span><i class="fa-solid fa-circle-check" style="color: #63E6BE;"></i></span>
                    <span class="trash-icon-wrapper rounded"><i class="fa-solid fa-trash text-white "></i></span>
                </div>
            </li>
        </ul>


    </section>








    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>

</body>

</html>
